name: Roma Mercato Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

  concurrency:
  group: roma-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install googlenewsdecoder    

      - name: Esegui il bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Salva le notizie già inviate
        run: |
          git config user.name "roma-bot"
          git config user.email "roma-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "aggiorna seen.json" && git pull --rebase && git push)


